# Reusable check fan-out. `bun run check` is a serial chain of sixteen scripts;
# this workflow runs the same commands as parallel jobs so wall time is bounded
# by the slowest slice instead of the sum. The Next smoke, the Vite toolchain
# matrix and the unit tests are split further into matrix rows that together
# cover exactly what the local scripts run. CI (pull_request, push) and Release
# (tag) both call it.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Pull requests and tags only restore. A main push saves a new lockfile's
      # cache once, here, so the other jobs never race to upload the same key.
      - id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun run check:portfolio-inventory
      - run: bun run check:ask-ai-marks
      - run: bun run typecheck
      - run: bun run build
      - run: bun run check:committed-dist
      - run: bun run check:stylex-artifacts
      - run: bun run check:stylex-compiler-artifacts
      - run: bun run check:stylex-determinism
      - run: bun run check:stylex-consumer-layers
      - name: Generated files are committed
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all(["./dist/index.js"].map((path) => import(path)))'

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Restore only; the Static job saves the cache from main pushes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run test:package
      - name: Read installed Playwright version
        id: playwright-version
        run: bun -e 'console.log("version=" + require("playwright-core/package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Restore pinned Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Provision pinned Chromium for process custody verification
        run: bunx --no-install playwright-core install --with-deps chromium
      - run: bun run test:vite-custody
      - run: bun run test:packed-bun-browser
      - name: Generated files are committed
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  vite:
    name: Vite adopters (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # `test:vite-adopter`, then each row of `test:vite78-adopter`
          # (fixtures/vite8-adopter/toolchain.ts) as its own job.
          - name: adopter
            command: bun run test:vite-adopter
          - name: vite 7.3.6 rollup 4.63.1
            command: bun run ./scripts/vite8-adopter-smoke.ts --toolchain=0
          - name: vite 8.2.1 rolldown 1.2.7
            command: bun run ./scripts/vite8-adopter-smoke.ts --toolchain=1
          - name: vite 8.2.1 rolldown 1.2.8
            command: bun run ./scripts/vite8-adopter-smoke.ts --toolchain=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Restore only; the Static job saves the cache from main pushes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # The toolchain rows above are listed by hand. Fail if
      # fixtures/vite8-adopter/toolchain.ts gains, loses, or changes a row, so
      # a new toolchain can never go untested in CI.
      - name: Check the matrix covers every Vite toolchain
        if: matrix.name == 'adopter'
        env:
          ROWS: '["vite 7.3.6 rollup 4.63.1","vite 8.2.1 rolldown 1.2.7","vite 8.2.1 rolldown 1.2.8"]'
        run: |
          # shellcheck disable=SC2016 # the backticks are a JavaScript template
          bun -e 'import { viteMatrixToolchains as rows } from "./fixtures/vite8-adopter/toolchain.ts";
          const actual = rows.map((row) => `vite ${row.vite} ${row.bundler} ${row.version}`);
          if (JSON.stringify(actual) !== process.env.ROWS) {
            console.error(`checks.yml Vite rows ${process.env.ROWS} do not match toolchain.ts ${JSON.stringify(actual)}; add a --toolchain=<index> row per toolchain.`);
            process.exit(1);
          }'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Read installed Playwright version
        id: playwright-version
        run: bun -e 'console.log("version=" + require("playwright-core/package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Restore pinned Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Provision pinned Playwright Chromium
        run: bunx --no-install playwright-core install --with-deps chromium
      - run: bun run build
      - run: ${{ matrix.command }}
      - name: Generated files are committed
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  next:
    name: Next adopter (${{ matrix.next }}, ${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The two exact profile rows of `test:next-adopter`, each split into
        # its two phases: the full Edge build with the server and browser
        # proof, and the no-Edge then default-error rebuilds.
        next: ["16.2.12", "16.3.3"]
        phase: [edge, fallbacks]
        include:
          - next: "16.2.12"
            profile: ""
          - next: "16.3.3"
            profile: --next-version=16.3.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Restore only; the Static job saves the cache from main pushes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Read installed Playwright version
        id: playwright-version
        if: matrix.phase == 'edge'
        run: bun -e 'console.log("version=" + require("playwright-core/package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Restore pinned Playwright browser cache
        if: matrix.phase == 'edge'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Provision pinned Playwright Chromium
        if: matrix.phase == 'edge'
        run: bunx --no-install playwright-core install --with-deps chromium
      - run: bun run build
      - run: bun run ./scripts/next-adopter-smoke.ts ${{ matrix.profile }} --phase=${{ matrix.phase }}
      - name: Generated files are committed
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  unit:
    name: Unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two slowest files, which run real bundler builds, get their own
          # job. The other shard is the unchanged `test` script with those files
          # ignored, so a new test file always lands in it.
          - shard: builds
            command: >-
              bun test --isolate --preload ./scripts/register-stylex-test-transform.ts
              ./build/bun.test.ts ./build/next-generation.test.ts
          - shard: rest
            command: >-
              bun run test
              --path-ignore-patterns=build/bun.test.ts
              --path-ignore-patterns=build/next-generation.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Restore only; the Static job saves the cache from main pushes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: ${{ matrix.command }}
      - name: Generated files are committed
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Restore only; the Static job saves the cache from main pushes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Read installed Playwright version
        id: playwright-version
        run: bun -e 'console.log("version=" + require("playwright-core/package.json").version)' >> "$GITHUB_OUTPUT"
      # Browser is the sole save owner; other jobs, pull requests, and tags restore.
      - name: Restore pinned Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Provision pinned Playwright Chromium
        run: bunx --no-install playwright-core install --with-deps chromium
      - name: Save pinned Playwright browser cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - run: bun run build
      - run: bun run test:browser
      - name: Generated files are committed
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
