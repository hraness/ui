name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter lists pull request files through the API, which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Every pattern must hold, so the negations exclude docs-only changes; with the
          # default "some", '**' alone matched every file and code was always true.
          predicate-quantifier: every
          # Everything is code except files no check reads. README.md and
          # LICENSE stay code: the readme contract test and `bun pm pack` read them.
          filters: |
            code:
              - '**'
              - '!kb/**'
              - '!.agents/**'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
              - '!STYLE.md'
              - '!WRITING.md'
              - '!.github/dependabot.yml'
              - '!.github/workflows/release.yml'
              - '!.github/workflows/dependabot-auto-merge.yml'

  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  required:
    name: Required
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]]
          if [[ "$CODE_CHANGED" == false ]]; then
            # A deliberate paths-filter skip: only docs no check reads changed.
            [[ "$CHECKS" == skipped ]]
          else
            [[ "$CHECKS" == success ]]
          fi
