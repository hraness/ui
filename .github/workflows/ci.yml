name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Main runs group by
# commit and are never cancelled, so every merged SHA keeps its own result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # paths-filter lists pull request files through the API, which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Every pattern must hold, so the negations exclude docs-only changes; with the
          # default "some", '**' alone matched every file and code was always true.
          predicate-quantifier: every
          # Package tests read README.md and LICENSE. The focused signing test
          # below covers isolated release workflow changes.
          filters: |
            signing_workflow:
              - '.github/workflows/release.yml'
            code:
              - '**'
              - '!kb/**'
              - '!.agents/**'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
              - '!STYLE.md'
              - '!WRITING.md'
              - '!.github/dependabot.yml'
              - '!.github/workflows/release.yml'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.filter.outputs.signing_workflow == 'true' && steps.filter.outputs.code == 'false'
        with:
          bun-version: "1.3.14"
      - name: Check hosted signers for release workflow changes
        if: steps.filter.outputs.signing_workflow == 'true' && steps.filter.outputs.code == 'false'
        run: bun test --test-name-pattern 'release signing jobs' scripts/release-artifact.test.ts

  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  required:
    name: Required
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]]
          if [[ "$CODE_CHANGED" == false ]]; then
            # A deliberate paths-filter skip: only docs no check reads changed.
            [[ "$CHECKS" == skipped ]]
          else
            [[ "$CHECKS" == success ]]
          fi
