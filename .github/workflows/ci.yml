name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          # Everything is code except files no check reads. README.md and
          # LICENSE stay code: the readme contract test and `bun pm pack` read them.
          filters: |
            code:
              - '**'
              - '!kb/**'
              - '!.agents/**'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
              - '!STYLE.md'
              - '!WRITING.md'
              - '!.github/dependabot.yml'
              - '!.github/workflows/release.yml'
              - '!.github/workflows/dependabot-auto-merge.yml'

  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  required:
    name: Required
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]]
          if [[ "$CODE_CHANGED" == false ]]; then
            # A deliberate paths-filter skip: only docs no check reads changed.
            [[ "$CHECKS" == skipped ]]
          else
            [[ "$CHECKS" == success ]]
          fi
